<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | TaskFlow</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth-styles-2025.css">
  <link rel="stylesheet" href="header-styles.css">
  <link rel="stylesheet" href="toast-styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .vertical-auth-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .vertical-auth-header h2 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.01em;
      background: linear-gradient(120deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .vertical-auth-header .modal-subtitle {
      font-size: 1.1rem;
      color: #64748b;
      margin: 0;
      text-align: center;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="modal show" style="position:static;display:flex;align-items:center;justify-content:center;height:100vh;background:none;backdrop-filter:none;">
    <div class="modal-content" style="max-width:440px;width:100%;margin:auto;">
      <div class="vertical-auth-header">
        <h2>Welcome Back</h2>
        <p class="modal-subtitle">Sign in to continue your productivity journey</p>
      </div>
      <form id="login-form" class="modern-form">
        <div class="form-group floating-label">
          <input type="email" id="login-email" required autocomplete="email">
          <label for="login-email">
            <i class="fas fa-envelope"></i>
            Email Address
          </label>
          <div class="input-focus-border"></div>
        </div>
        <div class="form-group floating-label">
          <input type="password" id="login-password" required>
          <label for="login-password">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <button type="button" class="password-toggle" tabindex="-1">
            <i class="fas fa-eye"></i>
          </button>
          <div class="input-focus-border"></div>
        </div>
        <div class="form-extras">
          <label class="remember-me">
            <input type="checkbox" id="remember-me">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        <div id="login-error" class="form-error">
          <i class="fas fa-exclamation-circle"></i>
          <span class="error-message"></span>
        </div>
        <div class="auth-actions">
          <button type="submit" class="btn-primary">
            <span>Sign In</span>
            <i class="fas fa-arrow-right"></i>
          </button>
          <a href="guest.html" class="btn-secondary" style="text-decoration:none;display:flex;align-items:center;justify-content:center;gap:0.5rem;">
            <i class="fas fa-user-secret"></i>
            <span>Continue as Guest</span>
          </a>
        </div>
        <div class="social-login">
          <div class="auth-separator">
            <span>Or continue with</span>
          </div>
          <div class="social-buttons">
            <button type="button" class="social-btn google">
              <img src="https://www.google.com/favicon.ico" alt="Google">
              Google
            </button>
            <button type="button" class="social-btn github">
              <i class="fab fa-github"></i>
              GitHub
            </button>
          </div>
        </div>
        <div class="auth-switch">
          <span>New to TaskFlow?</span>
          <a href="signup.html" id="switch-to-signup">Create an account</a>
        </div>
      </form>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
